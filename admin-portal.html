      <nav class="member-nav" aria-label="관리자 메뉴">
        <button class="active" data-admin-view="overview" type="button">⌂ 운영 현황</button>

      <div class="member-content">
        <section id="admin-view-overview" class="member-view active">
          <div class="member-grid">
            <article class="member-card third"><div class="member-card-head"><div><p>활성 학생</p><h2 id="activeStudentCount">-</h2></div></div></article>
