<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --accent:#4A90E2;
    --accent-deep:#2E6DC2;
    --accent-light:#E3F2FD;
    --navy:#16324F;
    --ink:#111;
    --gray:#8B95A1;
    --line:#E9EEF3;
    --bg:#F5F8FB;
    --white:#fff;
  }
  html,body{height:100%;}
  body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;}

  /* TOP BAR */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--white);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:1rem 1.2rem;}
  .icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;color:var(--ink);font-size:1.3rem;border-radius:50%;transition:background .15s;}
  .icon-btn:hover{background:var(--bg);}
  .topbar-title{font-weight:800;font-size:1rem;}
  .progress-track{height:5px;background:var(--line);}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .35s ease;}

  /* MAIN */
  main{max-width:640px;margin:0 auto;padding:5.2rem 1.2rem 7rem;min-height:100vh;}

  .history{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.4rem;}
  .history-item{align-self:flex-end;max-width:80%;text-align:right;}
  .history-bubble{display:inline-block;background:var(--navy);color:#fff;padding:.7rem 1.1rem;border-radius:1.2rem 1.2rem .3rem 1.2rem;font-size:.88rem;font-weight:600;}
  .history-edit{display:block;font-size:.74rem;color:var(--gray);margin-top:.3rem;text-decoration:underline;cursor:pointer;background:none;border:none;}

  .qcard{background:var(--white);border:1px solid var(--line);border-radius:1.6rem;padding:2rem 1.6rem;box-shadow:0 12px 32px rgba(22,50,79,0.06);opacity:0;transform:translateY(14px);animation:qin .4s ease forwards;}
  @keyframes qin{to{opacity:1;transform:translateY(0);}}
  .qtitle{font-size:1.28rem;font-weight:800;line-height:1.45;margin-bottom:.4rem;letter-spacing:-0.01em;}
  .qsub{font-size:.85rem;color:var(--gray);margin-bottom:1.4rem;}
  .qtitle + .qsub{margin-top:-.2rem;}

  .opt-list{display:flex;flex-direction:column;gap:.7rem;}
  .opt{display:flex;align-items:center;gap:.8rem;border:1.5px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;cursor:pointer;transition:border-color .15s, background .15s;background:var(--white);}
  .opt:hover{border-color:#c9dcf3;}
  .opt.selected{border-color:var(--accent);background:var(--accent-light);}
  .opt-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;position:relative;}
  .opt.multi .opt-dot{border-radius:6px;}
  .opt.selected .opt-dot{border-color:var(--accent);background:var(--accent);}
  .opt-rank-badge{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:var(--gray);transition:all .15s;}
  .opt.rank.selected .opt-rank-badge{border-color:var(--accent);background:var(--accent);color:#fff;}
  .opt-label{font-size:.98rem;font-weight:600;}

  /* TIER CARDS */
  .tier-opt{border:1.5px solid var(--line);border-radius:1.1rem;padding:1.1rem 1.2rem;cursor:pointer;transition:border-color .15s, background .15s;position:relative;background:var(--white);}
  .tier-opt.selected{border-color:var(--accent);background:var(--accent-light);}
  .tier-opt-badge{position:absolute;top:-10px;right:1.1rem;background:var(--accent);color:#fff;font-size:.66rem;font-weight:800;padding:.22rem .6rem;border-radius:1rem;}
  .tier-opt-top{display:flex;justify-content:space-between;align-items:center;}
  .tier-opt-name{font-weight:800;font-size:1.02rem;}
  .tier-opt-price{font-weight:800;color:var(--accent-deep);font-size:.95rem;}
  .tier-opt-desc{font-size:.82rem;color:var(--gray);margin-top:.35rem;line-height:1.5;}
  .tier-more-arrow{display:inline-block;transition:transform .2s;font-size:.7rem;}
  .tier-more{max-height:0;overflow:hidden;transition:max-height .25s ease, margin-top .25s ease;font-size:.82rem;color:var(--ink);line-height:1.6;background:var(--bg);border-radius:.7rem;}
  .tier-more.open{max-height:260px;margin-top:.6rem;padding:.8rem .9rem;overflow:visible;}
  .tier-more-caption{margin-top:.5rem;font-size:.72rem;color:var(--gray);line-height:1.5;}
  .surcharge-note{margin-top:1rem;border-top:1px solid var(--line);padding-top:1rem;}
  .surcharge-toggle{background:none;border:none;padding:0;font-size:.82rem;color:var(--gray);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:.3rem;font-family:'Pretendard',sans-serif;}
  .surcharge-toggle.open .tier-more-arrow{transform:rotate(180deg);}
  .surcharge-body{max-height:0;overflow:hidden;transition:max-height .25s ease, margin-top .25s ease;font-size:.8rem;color:var(--gray);line-height:1.6;}
  .surcharge-body.open{max-height:150px;margin-top:.6rem;}
  /* 파란 원 ? 만들기 */
  .tip-icon{
     position: relative;
     display:inline-flex;
     justify-content:center;
     align-items:center;

     width:18px;
     height:18px;

     border-radius:50%;
     background:#4A90E2;
     color:white;

     font-size:11px;
     font-weight:700;

     cursor:help;
     margin-left:4px;
 }
 /* 말풍선 */
 .tip-bubble{
   display:none; position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
   background:var(--navy);color:#fff;font-size:.8rem;font-weight:500;line-height:1.6;
   padding:.75rem .9rem;border-radius:.6rem;width:240px;white-space:normal;z-index:20;
   box-shadow:0 8px 20px rgba(0,0,0,0.2);text-align:left;
 }
 .tip-icon .tip-bubble::after{
   content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
   border:6px solid transparent;border-top-color:var(--navy);
 }
 .tip-icon:hover .tip-bubble{
     display:block;
 }
 .tip-icon.open .tip-bubble{ display:block; }
  textarea, input[type=text], input[type=tel]{
    width:100%;font-family:'Pretendard',sans-serif;font-size:.98rem;padding:1rem 1.1rem;
    border:1.5px solid var(--line);border-radius:1rem;background:var(--bg);color:var(--ink);outline:none;
    transition:border-color .15s, background .15s;
  }
  select{
    font-family:'Pretendard',sans-serif;font-size:.92rem;padding:.85rem .9rem;
    border:1.5px solid var(--line);border-radius:.9rem;background:var(--bg);color:var(--ink);outline:none;
  }
  textarea:focus, input:focus{border-color:var(--accent);background:var(--white);}

  .field-label{font-size:.82rem;font-weight:700;color:var(--gray);margin:1rem 0 .5rem;}
  .field-label:first-child{margin-top:0;}
  .quick-fill{display:inline-block;margin-top:.8rem;font-size:.8rem;color:var(--accent-deep);background:var(--accent-light);padding:.5rem .9rem;border-radius:1rem;border:none;cursor:pointer;font-weight:700;}

  .grid-wrap{max-height:420px;overflow-y:auto;overflow-x:auto;border:1px solid var(--line);border-radius:1rem;-webkit-overflow-scrolling:touch;}
  .time-grid{border-collapse:collapse;margin:0 auto;user-select:none;-webkit-user-select:none;}
  .time-grid thead th{position:sticky;top:0;background:var(--white);z-index:2;font-size:.72rem;font-weight:800;color:var(--gray);padding:.5rem .2rem;border-bottom:1px solid var(--line);text-align:center;}
  .time-grid thead th:first-child{left:0;z-index:3;}
  .hour-label{position:sticky;left:0;background:var(--white);font-size:.68rem;color:var(--gray);font-weight:700;padding:0 .5rem;white-space:nowrap;border-right:1px solid var(--line);text-align:right;z-index:1;}
  .grid-cell{width:34px;height:30px;border:1px solid var(--line);background:var(--bg);cursor:pointer;touch-action:pan-y;text-align:center;vertical-align:middle;font-size:.62rem;font-weight:800;color:transparent;}
  .grid-cell.selected{background:var(--accent);color:#fff;}

  .note-chip{display:inline-flex;align-items:center;gap:.4rem;background:var(--accent-light);color:var(--accent-deep);font-size:.78rem;font-weight:700;padding:.4rem .5rem .4rem .8rem;border-radius:1rem;}
  .note-chip button{background:none;border:none;color:var(--accent-deep);font-size:.9rem;cursor:pointer;line-height:1;padding:0 .2rem;}
  .note-add-row{display:flex;gap:.5rem;}
  .note-add-btn{flex-shrink:0;width:44px;border:1.5px solid var(--line);border-radius:.9rem;background:var(--bg);color:var(--accent-deep);font-size:1.2rem;font-weight:800;cursor:pointer;}

  /* PAYMENT */
  .pay-box{background:var(--bg);border-radius:1rem;padding:1.1rem 1.3rem;margin-bottom:1rem;}
  .pay-row{display:flex;justify-content:space-between;gap:1rem;font-size:.92rem;padding:.55rem 0;border-bottom:1px solid var(--line);}
  .pay-row:last-child{border-bottom:none;}
  .pay-row span:first-child{color:var(--gray);}
  .pay-row strong{color:var(--ink);text-align:right;}

  .consent-box{margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--line);}
  .consent-row{display:flex;align-items:flex-start;gap:.6rem;font-size:.9rem;font-weight:600;cursor:pointer;}
  .consent-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin-top:.15rem;}
  .required-mark{color:var(--accent-deep);font-weight:700;}
  .consent-toggle{background:none;border:none;font-size:.78rem;color:var(--gray);text-decoration:underline;cursor:pointer;margin-top:.5rem;padding:0;font-family:'Pretendard',sans-serif;}
  .consent-detail{margin-top:.6rem;background:var(--bg);border-radius:.8rem;padding:.9rem 1rem;font-size:.78rem;color:var(--gray);line-height:1.8;}
  .consent-detail strong{color:var(--ink);}

  /* BOTTOM BAR */
  .bottombar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--line);padding:1rem 1.2rem;z-index:50;}
  .bottombar-inner{max-width:640px;margin:0 auto;display:flex;gap:.7rem;}
  .btn-skip{flex:0 0 auto;background:var(--white);border:1.5px solid var(--line);color:var(--gray);padding:1rem 1.3rem;border-radius:1rem;font-weight:700;font-size:.95rem;cursor:pointer;font-family:'Pretendard',sans-serif;}
  .btn-next{flex:1;background:var(--line);color:#fff;border:none;padding:1rem;border-radius:1rem;font-weight:800;font-size:1rem;cursor:not-allowed;transition:background .2s;font-family:'Pretendard',sans-serif;}
  .btn-next.active{background:var(--accent);cursor:pointer;}
  .btn-next.active:hover{background:var(--accent-deep);}

  /* SUCCESS */
  .success-wrap{display:none;max-width:520px;margin:0 auto;padding:7rem 1.4rem 4rem;text-align:center;}
  .success-badge{width:76px;height:76px;border-radius:50%;background:var(--accent-light);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 1.4rem;}
  .success-title{font-size:1.5rem;font-weight:900;margin-bottom:.7rem;letter-spacing:-0.01em;}
  .success-text{font-size:.95rem;color:var(--gray);line-height:1.7;margin-bottom:2rem;}
  .trust-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:2rem;}
  .trust-item{background:var(--white);border:1px solid var(--line);border-radius:1rem;padding:1.1rem .5rem;}
  .trust-num{font-size:1.15rem;font-weight:900;color:var(--navy);}
  .trust-label{font-size:.72rem;color:var(--gray);margin-top:.2rem;}
  .summary-box{text-align:left;background:var(--white);border:1px solid var(--line);border-radius:1.2rem;padding:1.4rem 1.5rem;font-size:.88rem;line-height:2;color:var(--ink);margin-bottom:1.6rem;}
  .summary-box strong{color:var(--accent-deep);}
  .btn-home{display:inline-block;background:var(--accent);color:#fff;padding:1rem 2.2rem;border-radius:3rem;font-weight:800;text-decoration:none;font-size:.98rem;}

  @media (max-width:480px){
    .qcard{padding:1.6rem 1.2rem;border-radius:1.3rem;}
    .qtitle{font-size:1.12rem;}
    .trust-row{gap:.5rem;}
  }
</style>
</head>

const answers = {};
const historyEl = document.getElementById('history');
const qcardWrap = document.getElementById('qcardWrap');
const progressFill = document.getElementById('progressFill');

const dragState = { isDragging: false, mode: true };
document.addEventListener('mouseup', () => { dragState.isDragging = false; });

function updateProgress(){
  const pct = Math.round((current / steps.length) * 100);
  progressFill.style.width = pct + '%';
}

function labelFor(step, value){
  if (step.type === 'multi') return Array.isArray(value) && value.length ? value.join(', ') : '';
  if (step.type === 'rank') return Array.isArray(value) && value.length ? value.map((v,i)=>(i+1)+'.'+v).join(', ') : '';
  if (step.type === 'gridtime') return Array.isArray(value) && value.length ? value.length + '개 시간대 선택' : '';
  if (step.type === 'contact') return value && value.name ? value.name + ' · ' + (value.phone || '') : '';
  if (step.type === 'payment') return value === true ? '확인 완료' : '';
  return value || '';
}

function renderHistory(){
  historyEl.innerHTML = '';
  for (let i = 0; i < current; i++){
    const step = steps[i];
    const val = answers[step.key];
    const text = labelFor(step, val);
    if (!text) continue;
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = '<div class="history-bubble">' + text + '</div><button class="history-edit" data-idx="' + i + '">수정</button>';
    historyEl.appendChild(item);
  }
  historyEl.querySelectorAll('.history-edit').forEach(btn => {
    btn.addEventListener('click', () => { current = parseInt(btn.dataset.idx); renderStep(); });
  });
}

function checkValid(step){
  const v = answers[step.key];
  if (!step.required) return true;
  if (step.type === 'single') return !!v;
  if (step.type === 'tier') return !!v;
  if (step.type === 'multi') return Array.isArray(v) && v.length > 0;
  if (step.type === 'rank') return Array.isArray(v) && v.length > 0;
  if (step.type === 'date') return !!v;
  if (step.type === 'gridtime') return Array.isArray(v) && v.length > 0;
  if (step.type === 'text') return true;
  if (step.type === 'contact') return v && v.name && v.name.trim() && v.phoneValid && v.consent === true;
  if (step.type === 'payment') return v === true;
  return false;
}

function setNextState(step){
  const valid = checkValid(step);
  nextBtn.classList.toggle('active', valid);
  nextBtn.disabled = !valid;
  nextBtn.textContent = current === steps.length - 1 ? '제출하기' : '다음';
  skipBtn.style.display = step.required ? 'none' : 'block';
}

function renderStep(){
  if (current >= steps.length){ showSuccess(); return; }
  const step = steps[current];
  updateProgress();
  renderHistory();
  backBtn.style.visibility = current === 0 ? 'hidden' : 'visible';

    } else if (step.type === 'date'){

    } else if (step.type === 'rank'){
      inner += '<div class="opt-list">';
      const selected = answers[step.key] || [];
      RANK_OPTIONS.forEach(opt => {

      });
      inner += '</div>';
    } else if (step.type === 'single' || step.type === 'multi'){
      inner += '<div class="opt-list">';

    const selected = answers[step.key] || (step.type === 'multi' ? [] : null);

  } else if (step.type === 'gridtime'){
    const days = ['월','화','수','목','금','토','일'];
    const hours = ['9:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00','23:00','24:00'];
    const selectedArr = answers[step.key] || [];

    hours.forEach(h => {

      days.forEach(d => {

      });
      inner += '</tr>';
    });
    inner += '</tbody></table></div>';
    inner += ''
      + '<div class="field-label" style="margin-top:1rem;">표는 정각 시간만 보여드려요. 30분 단위(예: 9시 30분)로 가능하시면 아래에서 추가해주세요.<br>가능하신 시간을 전부 골라서 알려주시면 정확한 매칭에 더 도움이 돼요.<br> 선택 후 ➕를 눌러야 목록에 추가됩니다.</div>'
      + '<div id="noteChips" style="display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem;"></div>'
      + '<div class="note-add-row">'
      + '<select id="noteDay" style="flex:1;">'
      + '<option value="">요일</option>'
      + '<option>월요일</option><option>화요일</option><option>수요일</option><option>목요일</option><option>금요일</option><option>토요일</option><option>일요일</option>'
      + '</select>'
      + '<select id="noteHour" style="flex:1;"><option value="">30분 단위 시간</option></select>'
      + '<button type="button" class="note-add-btn" id="addNoteBtn">+</button>'
      + '</div>';

    const val = answers[step.key] || '';
    inner += '<textarea id="textInput" placeholder="' + (step.placeholder||'') + '">' + val + '</textarea>';

  } else if (step.type === 'contact'){
    const v = answers[step.key] || {name:'', phone:'', consent:false};
    inner += ''
      + '<div class="field-label">이름</div>'
      + '<input type="text" id="nameInput" placeholder="홍길동" value="' + v.name + '">'
      + '<div class="field-label">연락처</div>'
      + '<input type="tel" id="phoneInput" placeholder="010-0000-0000" value="' + v.phone + '">'
      + '<div class="consent-box">'
      + '<label class="consent-row">'
      + '<input type="checkbox" id="consentCheck" ' + (v.consent ? 'checked' : '') + '>'
      + '<span>개인정보 수집·이용에 동의합니다 <span class="required-mark">(필수)</span></span>'
      + '</label>'
      + '<button type="button" class="consent-toggle" id="consentToggle">자세히 보기</button>'
      + '<div class="consent-detail" id="consentDetail" style="display:none;">'
      + '<strong>수집 항목</strong> 이름, 연락처, 영어 수준, 학습 목표, 희망 시간대, 진행 방식, 문의사항<br>'
      + '<strong>수집 목적</strong> 선생님 매칭 및 상담을 위한 연락<br>'
      + '<strong>보유 기간</strong> 목적 달성 시 지체 없이 파기 (관련 법령에 따른 보관 예외 있음)<br>'
      + '동의를 거부하실 수 있으며, 다만 동의하지 않으실 경우 매칭 서비스 신청이 어렵습니다.<br><br>'
      + '자세한 내용은 <a href="privacy.html" target="_blank" style="color:var(--accent);font-weight:700;">개인정보처리방침</a> 및 <a href="terms.html" target="_blank" style="color:var(--accent);font-weight:700;">이용약관</a> 전문을 확인해주세요.'
      + '</div>'
      + '</div>';
  } else if (step.type === 'payment'){
    const tierName = answers.tier || '-';
    const price = TIER_PRICES[answers.tier] || 0;

      + '<div class="pay-box">'
      + '<div class="pay-row"><span>선택 플랜</span><strong>' + tierName + '</strong></div>'
      + '<div class="pay-row"><span>결제 금액</span><strong>₩' + price.toLocaleString() + '</strong></div>'
      + '<div class="pay-row"><span>입금 은행</span><strong>' + BANK_INFO.bank + '</strong></div>'
      + '<div class="pay-row"><span>계좌번호</span><strong>' + BANK_INFO.account + '</strong></div>'
      + '<div class="pay-row"><span>예금주</span><strong>' + BANK_INFO.holder + '</strong></div>'
      + '</div>'
      + '<div class="qsub" style="margin-top:-.4rem;">입금자명은 <strong style="color:var(--ink);">신청자 성함과 동일하게</strong> 입금해주세요. 매칭까지는 24시간이 걸립니다.<br> 매칭완료 전까지 입금부탁드립니다.</div>'
      + '<div class="consent-box">'
      + '<label class="consent-row">'
      + '<input type="checkbox" id="paymentAckCheck" ' + (answers.payment ? 'checked' : '') + '>'
      + '<span>위 결제 안내를 확인했습니다 <span class="required-mark">(필수)</span></span>'
      + '</label>'
      + '</div>';

  inner += '</div>';
  qcardWrap.innerHTML = inner;

    if (step.type === 'tier'){

      el.addEventListener('click', () => {
        if (answers.tier !== el.dataset.value) {
          answers.place = [];   // 요금제가 바뀌면 장소 선택 초기화
        }
        answers.tier = el.dataset.value;
        qcardWrap.querySelectorAll('.tier-opt').forEach(o => {
          o.classList.remove('selected');
          o.querySelector('.tier-more').classList.remove('open');
        });
        el.classList.add('selected');
        el.querySelector('.tier-more').classList.add('open');
        setNextState(step);
      });
    });
    qcardWrap.querySelectorAll('.tip-icon').forEach(tip => {
      tip.addEventListener('click', (e) => {
        e.stopPropagation();
        qcardWrap.querySelectorAll('.tip-icon').forEach(t => { if (t !== tip) t.classList.remove('open'); });
        tip.classList.toggle('open');
      });
    });

    const surchargeToggle = document.getElementById('surchargeToggle');
    if (surchargeToggle) {
      surchargeToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const body = document.getElementById('surchargeBody');
        const open = body.classList.toggle('open');
        surchargeToggle.classList.toggle('open', open);
      });
    }

    } else if (step.type === 'date'){
    const dateInput = document.getElementById('dateInput');
    if (!answers[step.key]) { answers[step.key] = dateInput.value; }
    dateInput.addEventListener('input', () => {
      answers[step.key] = dateInput.value;
      setNextState(step);
    });
  } else if (step.type === 'rank'){
    qcardWrap.querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        const val = el.dataset.value;
        const arr = answers[step.key] || [];
        const idx = arr.indexOf(val);
        if (idx > -1) { arr.splice(idx, 1); } else { arr.push(val); }
        answers[step.key] = arr;
        qcardWrap.querySelectorAll('.opt').forEach(o => {
          const rIdx = arr.indexOf(o.dataset.value);
          const sel = rIdx > -1;
          o.classList.toggle('selected', sel);
          o.querySelector('.opt-rank-badge').textContent = sel ? (rIdx + 1) : '';
        });
        setNextState(step);
      });
    });
  } else if (step.type === 'single' || step.type === 'multi'){
    qcardWrap.querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        const val = el.dataset.value;
        if (step.type === 'single'){
          answers[step.key] = val;
          qcardWrap.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
          el.classList.add('selected');
        } else {
          const arr = answers[step.key] || [];
          const idx = arr.indexOf(val);
          if (idx > -1) arr.splice(idx,1); else arr.push(val);
          answers[step.key] = arr;
          el.classList.toggle('selected');
        }
        setNextState(step);
      });
    });
  } else if (step.type === 'gridtime'){
    const selectedArr = answers[step.key] || [];
    const CHIP_DAYS = ['월요일','화요일','수요일','목요일','금요일','토요일','일요일'];
    const isChipEntry = v => CHIP_DAYS.some(d => v.indexOf(d) === 0);
    const syncAll = () => {
      qcardWrap.querySelectorAll('.grid-cell').forEach(c => {
        const sel = selectedArr.indexOf(c.dataset.key) > -1;
        c.classList.toggle('selected', sel);
      });
      const wrap = document.getElementById('noteChips');
      if (wrap) {
        const chipEntries = selectedArr.map((v,i)=>({v,i})).filter(o => isChipEntry(o.v));
        wrap.innerHTML = chipEntries.map(o => '<span class="note-chip">' + o.v + '<button type="button" data-i="' + o.i + '">✕</button></span>').join('');        wrap.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedArr.splice(parseInt(btn.dataset.i), 1);
            answers[step.key] = selectedArr;
            syncAll();
            setNextState(step);
          });
        });
      }
    };
    const applyCell = (cell, shouldSelect) => {
      const key = cell.dataset.key;
      const idx = selectedArr.indexOf(key);
      if (shouldSelect && idx === -1) { selectedArr.push(key); }
      else if (!shouldSelect && idx > -1) { selectedArr.splice(idx, 1); }
      answers[step.key] = selectedArr;
      syncAll();
      setNextState(step);
    };
    qcardWrap.querySelectorAll('.grid-cell').forEach(cell => {
      cell.addEventListener('mousedown', (e) => {
        e.preventDefault();
        dragState.isDragging = true;
        dragState.mode = selectedArr.indexOf(cell.dataset.key) === -1;
        applyCell(cell, dragState.mode);
      });
      cell.addEventListener('mouseenter', () => {
        if (dragState.isDragging) applyCell(cell, dragState.mode);
      });
      cell.addEventListener('touchend', (e) => {
        e.preventDefault();
        applyCell(cell, selectedArr.indexOf(cell.dataset.key) === -1);
      });
    });

    const noteDay = document.getElementById('noteDay');
    const noteHour = document.getElementById('noteHour');
    for (let h = 9; h <= 23; h++) {
      const opt = document.createElement('option');
      const label = h + ':30-' + (h + 1) + ':30';
      opt.value = label;
      opt.textContent = label;
      noteHour.appendChild(opt);
    }
    syncAll();
    document.getElementById('addNoteBtn').addEventListener('click', () => {
      if (noteDay.value && noteHour.value) {
        selectedArr.push(noteDay.value + ' ' + noteHour.value);
        answers[step.key] = selectedArr;
        noteDay.value = '';
        noteHour.value = '';
        syncAll();
        setNextState(step);
      }
    });
  } else if (step.type === 'text'){
    const ta = document.getElementById('textInput');
    ta.addEventListener('input', () => { answers[step.key] = ta.value; });
    const qf = document.getElementById('quickFillBtn');
    if (qf) qf.addEventListener('click', () => { ta.value = step.quickFill; answers[step.key] = step.quickFill; });
  } else if (step.type === 'contact'){
    const nameInput = document.getElementById('nameInput');
    const phoneInput = document.getElementById('phoneInput');
    const consentCheck = document.getElementById('consentCheck');
    const consentToggle = document.getElementById('consentToggle');
    const consentDetail = document.getElementById('consentDetail');
    const sync = () => {
    const phoneValid = /^01[0-9]-?\d{3,4}-?\d{4}$/.test(phoneInput.value.replace(/\s/g, ''));
    phoneInput.style.borderColor = (phoneInput.value && !phoneValid) ? '#E85C5C' : '';
    answers[step.key] = {
      name: nameInput.value,
      phone: phoneInput.value,
      phoneValid,
      consent: consentCheck.checked
    };
    setNextState(step);
  };
    nameInput.addEventListener('input', sync);
    phoneInput.addEventListener('input', sync);
    consentCheck.addEventListener('change', sync);
    consentToggle.addEventListener('click', () => {
      consentDetail.style.display = consentDetail.style.display === 'none' ? 'block' : 'none';
    });
  } else if (step.type === 'payment'){
    const ack = document.getElementById('paymentAckCheck');
    ack.addEventListener('change', () => {
      answers.payment = ack.checked;
      setNextState(step);
    });
  }

  setNextState(step);
}

nextBtn.addEventListener('click', () => {
  const step = steps[current];
  if (!checkValid(step)) return;
  current++;
  renderStep();
});

skipBtn.addEventListener('click', () => {
  current++;
  renderStep();
});

backBtn.addEventListener('click', () => {
  if (current > 0){ current--; renderStep(); }
});

async function submitToJotform(a) {
  const FORM_ID = '262064236851052';
  const API_KEY = '32abecc4b70bf065c8adf25c9b02b7cb';

  const params = new URLSearchParams();
  params.append('submission[3]', a.contact.name);                     // 이름
  params.append('submission[4][full]', a.contact.phone);              // 연락처
  params.append('submission[5]', a.ageGroup);                         // 나이대
  params.append('submission[7]', a.level);                            // 영어 수준
  (a.goals || []).forEach(g => params.append('submission[8][]', g));  // 학습 목표 (다중)
  (a.place || []).forEach(p => params.append('submission[29][]', p)); // 진행방식 (다중)
  params.append('submission[30]', a.tier || '');                      // 선택 플랜
  params.append('submission[31]', a.payment ? '완료' : '');           // 결제확인
  params.append(
    'submission[32]',
    (a.schedule || []).join(', ')
  );                                                          // 희망시간대
  params.append(
      'submission[33]',
      (a.place || []).map((p,i)=>(i+1)+'순위: '+p).join(' / ')
    );                                                                  // 진행방식 순위
    params.append('submission[34]', a.startDate || '');                 // 희망 시작일
    params.append('submission[28]', a.notes || '');                     // 문의사항
  try {
    await fetch('https://api.jotform.com/form/' + FORM_ID + '/submissions?apiKey=' + API_KEY, {
      method: 'POST',
      body: params
    });
  } catch (err) {
    console.error('Jotform 제출 실패:', err);
  }
}

    + '<strong>영어 수준</strong> · ' + (a.level || '-') + '<br>'
    + '<strong>학습 목표</strong> · ' + ((a.goals||[]).join(', ') || '-') + '<br>'
    + '<strong>희망 시간대</strong> · ' + ((a.schedule||[]).join(', ') || '-') + '<br>'    + '<strong>진행 방식</strong> · ' + ((a.place||[]).length ? (a.place||[]).map((p,i)=>(i+1)+'.'+p).join(', ') : '-') + '<br>'
    + '<strong>연락처</strong> · ' + (a.contact ? a.contact.name + ' · ' + a.contact.phone : '-');

  submitToJotform(a);
  console.log('신청 데이터:', a);
}

renderStep();
</script>
